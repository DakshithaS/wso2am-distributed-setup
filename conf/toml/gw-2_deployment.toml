[server]
hostname = "localhost"
node_ip = "127.0.0.1"
server_role = "gateway-worker"
offset=5

[user_store]
type = "database_unique_id"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://localhost:3357/shared_db400?autoReconnect=true&amp;useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "sharedadmin"
password = "sharedadmin123"
driver="com.mysql.cj.jdbc.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

# Key Manager configuration
[apim.key_manager]
service_url = "https://localhost:9443/services/"
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"

# Traffic Manager configurations
[apim.throttling]
throttle_decision_endpoints = ["tcp://localhost:5677"]

[[apim.throttling.url_group]]
traffic_manager_urls = ["tcp://localhost:9613", "tcp://localhost:9614", "tcp://localhost:9615"]
traffic_manager_auth_urls = ["ssl://localhost:9713", "ssl://localhost:9714", "ssl://localhost:9715"]
type = "loadbalance"

# Event Hub configurations
[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://localhost:9443/services/"
event_listening_endpoints = ["tcp://localhost:5677"]

[apim.sync_runtime_artifacts.gateway]
gateway_labels =["Default"]
