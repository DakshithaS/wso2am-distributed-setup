[server]
hostname = "localhost"
node_ip = "127.0.0.1"
server_role = "traffic-manager"
offset=3

[user_store]
type = "database_unique_id"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://localhost:3357/shared_db400?autoReconnect=true&amp;useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "sharedadmin"
password = "sharedadmin123"
driver="com.mysql.cj.jdbc.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

# Event Hub configurations
[apim.event_hub]
enable = true
username = "$ref{super_admin.username}"
password = "$ref{super_admin.password}"
service_url = "https://localhost:9443/services/"
event_listening_endpoints = ["tcp://localhost:5675"]

# Distributed Throttling Configuration
[apim.distributed_throttling]
enable = true
type = "redis"
sync_interval = 1
core_pool_size = 5

[apim.distributed_throttling.keyvalue_store]
host = "localhost"
port = 6379
user = ""
max_total = 20
max_idle = 20
min_idle = 4
block_when_exhausted = true
test_while_idle = true
min_evictable_idle_time_millis = 3000
time_between_eviction_runs_millis = 1200
