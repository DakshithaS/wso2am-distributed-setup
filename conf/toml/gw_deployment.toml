[server]
hostname = "localhost"
node_ip = "127.0.0.1"
server_role = "gateway-worker"
offset=4

[user_store]
type = "database_unique_id"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://localhost:3356/shared_db320?autoReconnect=true&amp;useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "sharedadmin"
password = "sharedadmin123"
driver="com.mysql.cj.jdbc.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

[apim.key_manager]
service_url = "https://localhost:9443/services/"

[apim.throttling]
service_url = "https://localhost:9446/services/"
throttle_decision_endpoints = ["tcp://localhost:5675"]

[[apim.throttling.url_group]]
traffic_manager_urls=["tcp://localhost:9614"]
traffic_manager_auth_urls=["ssl://localhost:9714"]

[apim.cors]
allow_origins = "*"
allow_methods = ["GET","PUT","POST","DELETE","PATCH","OPTIONS"]
allow_headers = ["authorization","Access-Control-Allow-Origin","Content-Type","SOAPAction"]
allow_credentials = false
