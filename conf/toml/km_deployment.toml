[server]
server_role = "api-key-manager"
hostname = "localhost"
node_ip = "127.0.0.1"
offset=0

[user_store]
type = "database_unique_id"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[database.apim_db]
type = "mysql"
url = "jdbc:mysql://localhost:3356/apim_db320?autoReconnect=true&amp;useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "apimadmin"
password = "apimadmin123"
driver="com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://localhost:3356/shared_db320?autoReconnect=true&amp;useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "sharedadmin"
password = "sharedadmin123"
driver="com.mysql.cj.jdbc.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

[apim.throttling]
throttle_decision_endpoints = ["tcp://localhost:5675"]

[[apim.throttling.url_group]]
traffic_manager_urls=["tcp://localhost:9614"]
traffic_manager_auth_urls=["ssl://localhost:9714"]

[[event_listener]]
id = "token_revocation"
type = "org.wso2.carbon.identity.core.handler.AbstractIdentityHandler"
name = "org.wso2.is.notification.ApimOauthEventInterceptor"
order = 1

[event_listener.properties]
notification_endpoint = "https://localhost:9446/internal/data/v1/notify"
username = "${admin.username}"
password = "${admin.password}"
'header.X-WSO2-KEY-MANAGER' = "default"

[apim.cache_invalidation]
enabled = true
domain = "km-domain"
