[server]
hostname = "localhost"
node_ip = "127.0.0.1"
server_role="api-store"
offset=2

[user_store]
type = "database_unique_id"

[super_admin]
username = "admin"
password = "admin"
create_admin_account = true

[database.apim_db]
type = "mysql"
url = "jdbc:mysql://localhost:3356/apim_db320?autoReconnect=true&amp;useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "apimadmin"
password = "apimadmin123"
driver="com.mysql.cj.jdbc.Driver"

[database.shared_db]
type = "mysql"
url = "jdbc:mysql://localhost:3356/shared_db320?autoReconnect=true&amp;useSSL=false&amp;allowPublicKeyRetrieval=true"
username = "sharedadmin"
password = "sharedadmin123"
driver="com.mysql.cj.jdbc.Driver"

[keystore.tls]
file_name =  "wso2carbon.jks"
type =  "JKS"
password =  "wso2carbon"
alias =  "wso2carbon"
key_password =  "wso2carbon"

[truststore]
file_name = "client-truststore.jks"
type = "JKS"
password = "wso2carbon"

[[apim.gateway.environment]]
name= "Production and Sandbox"
type= "hybrid"
display_in_api_console= true
description= "This is a hybrid gateway that handles both production and sandbox token traffic."
ws_endpoint= "ws://localhost:9099"
http_endpoint = "http://localhost:8284"
https_endpoint = "https://localhost:8247"
show_as_token_endpoint_url = true

[apim.key_manager]
service_url = "https://localhost:9443/services/"
username= "$ref{super_admin.username}"
password= "$ref{super_admin.password}"

[apim.oauth_config]
revoke_endpoint = "https://localhost:9443/revoke"

[apim.throttling]
throttle_decision_endpoints = ["tcp://localhost:5675"]

[[apim.throttling.url_group]]
traffic_manager_urls=["tcp://localhost:9614"]
traffic_manager_auth_urls=["ssl://localhost:9714"]

[apim.cache_invalidation]
enabled = true
domain = "devportal-domain"
