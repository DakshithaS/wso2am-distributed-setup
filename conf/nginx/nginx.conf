events {
    worker_connections 1024;
}

http {
    # HTTP backends for HTTP load balancer
    upstream wso2am_gateways_http {
        server host.docker.internal:8281 max_fails=3 fail_timeout=30s;  # Gateway 1 HTTP
        server host.docker.internal:8285 max_fails=3 fail_timeout=30s;  # Gateway 2 HTTP
    }

    # HTTP Load Balancer Configuration
    server {
        listen 80;
        server_name localhost;

        # Logging
        access_log /var/log/nginx/wso2am_access.log;
        error_log /var/log/nginx/wso2am_error.log;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "Load Balancer is running\n";
            add_header Content-Type text/plain;
        }

        # Proxy all API requests to HTTP backends
        location / {
            proxy_pass http://wso2am_gateways_http;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Connection settings
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }
    }
}