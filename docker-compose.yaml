version: "3.8"

name: wso2am-distributed-setup

services:
  # Nginx Load Balancer for WSO2 API Manager Gateways
  nginx-lb:
    image: nginx:alpine
    container_name: wso2am-nginx-lb
    ports:
      - "8080:80"     # HTTP Load Balancer
    volumes:
      - ./conf/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx-logs:/var/log/nginx
    networks:
      - wso2am-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  mysql:
    image: mysql:8
    container_name: wso2am-mysql
    ports:
      - "${MYSQL_PORT:-3316}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_USER: ${MYSQL_USER:-wso2carbon}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-wso2carbon}
    volumes:
      - ./conf/mysql/scripts:/docker-entrypoint-initdb.d
      - ./conf/mysql/conf/my.cnf:/etc/mysql/mysql.conf.d/my.cnf
      - ./wso2am-3.2.0/dbscripts:/home/dbScripts
      - mysql-apim-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "sh", "-c", "mysqladmin ping -uroot -proot && [ -f /var/lib/mysql/initialization-complete.flag ]"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
    networks:
      - wso2am-network

networks:
  wso2am-network:
    driver: bridge

volumes:
  mysql-apim-data:
  nginx-logs:
