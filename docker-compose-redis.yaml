version: '3.8'
services:
  redis:
    image: redis:7-alpine
    container_name: wso2am-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --protected-mode no
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - wso2am-network

volumes:
  redis-data:

networks:
  wso2am-network:
    driver: bridge